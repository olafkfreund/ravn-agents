[package]
name = "ravn-server"
description = "The Ravn control plane: ingests agent events, persists them, and serves the portal."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ravn-server"
path = "src/main.rs"

[dependencies]
ravn-core.workspace = true
ravn-crypto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
async-nats = "0.38"
futures-util = "0.3"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
prometheus = { version = "0.13", default-features = false }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
time = { version = "0.3", default-features = false, features = ["std"] }
# In-cluster agent auth (#57): validate ServiceAccount JWTs against the
# cluster's OIDC JWKS.
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Remediation templates (#115) are authored as TOML and loaded at startup.
toml = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
x509-parser = "0.16"
tempfile = "3"
