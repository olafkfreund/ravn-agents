[package]
name = "ravn-actuator"
description = "The privileged Ravn actuator (#113): executes only typed, whitelisted capabilities, behind a peer-credential-checked local socket. The sole privileged component; ravnd stays unprivileged."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ravn_actuator"
path = "src/lib.rs"

[[bin]]
name = "ravn-actuator"
path = "src/main.rs"

[dependencies]
ravn-core.workspace = true
ravn-crypto.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["socket"] }
kube = { version = "0.96", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.23", features = ["v1_31"] }

[dev-dependencies]
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
