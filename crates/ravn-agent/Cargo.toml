[package]
name = "ravn-agent"
description = "The ravnd daemon: detection, local inference, and transport to the control plane."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Library surface (reused by the eval harness, #38). Binary-private modules
# (config, detection, transport, buffer) stay in the bin; only the
# self-contained inference module is shared.
[lib]
name = "ravn_agent"
path = "src/lib.rs"

[[bin]]
name = "ravnd"
path = "src/main.rs"

[dependencies]
ravn-core.workspace = true
ravn-crypto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-nats = "0.38"
tokio-tungstenite = "0.24"
futures-util = "0.3"
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"
toml = "0.8"
notify = "6"
sha2 = "0.10"
hex = "0.4"
similar = "2"
zbus = { version = "4", default-features = false, features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
