[package]
name = "ravn-k8s"
description = "ravn-controller: watches the Kubernetes API for workload signals and publishes them as ravn-core Messages. Also ships the in-cluster K8s executor (#146)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Shared library: config + NATS publisher + the per-source mapping/watch loops,
# reused by both the controller and the node-agent binaries.
[lib]
name = "ravn_k8s"
path = "src/lib.rs"

[[bin]]
name = "ravn-controller"
path = "src/bin/ravn-controller.rs"

# DaemonSet node-agent (#56): one per node, detects node-level conditions.
[[bin]]
name = "ravn-node-agent"
path = "src/bin/ravn-node-agent.rs"

# In-cluster K8s executor (#146): pulls CommandEnvelopes, re-verifies Ed25519
# signatures, and executes typed K8s capabilities (DeletePod, RestartDeployment,
# PodState). Runs as a sidecar or separate Deployment alongside the controller.
[[bin]]
name = "ravn-k8s-executor"
path = "src/bin/ravn-k8s-executor.rs"

[dependencies]
ravn-core.workspace = true
# Crypto for Ed25519 signature re-verification inside the executor (#146).
ravn-crypto = { path = "../ravn-crypto" }
# Re-use the command-handling logic (precondition/verify/rollback) from the
# host actuator crate. The host-only executor types (SystemctlExecutor, serve)
# are unused; only CapabilityExecutor + handle_command are pulled in.
ravn-actuator = { path = "../ravn-actuator" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-nats = "0.38"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
# Read-only Kubernetes informer client. k8s-openapi is pinned to the cluster
# minor (v1.31, matching the k3d test cluster) so generated types line up.
kube = { version = "0.96", default-features = false, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.23", features = ["v1_31"] }
# Bounded per-pod LRU for log-line deduplication (issue #147).
lru = "0.12"

[dev-dependencies]
uuid = { version = "1", features = ["v7"] }
