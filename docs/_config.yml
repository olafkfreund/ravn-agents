title: Ravn
description: >-
  Self-hosted self-healing for Linux fleets — deterministic detection, signed
  and auditable remediation, and AI that explains but never decides. Runs on
  hosts, Kubernetes, and air-gapped networks.
url: "https://olafkfreund.github.io"
baseurl: "/ravn-agents"

# Custom Gruvbox theme lives in this repo (_layouts, _includes, assets) with a
# runtime light/dark toggle — no theme gem.
plugins:
  - jekyll-feed
  - jekyll-seo-tag

repository: olafkfreund/ravn-agents
github_username: olafkfreund

header_pages:
  - showcase.md
  - blog.md
  - roadmap.md
  - architecture.md
  - get-involved.md

# Posts don't carry a `layout:`; default them to the post layout.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Giscus comments (backed by GitHub Discussions).
# To enable: turn on Discussions in repo settings, install the Giscus GitHub App
# (https://github.com/apps/giscus), then fill repo_id and category_id from
# https://giscus.app. Until then, posts show a friendly placeholder.
giscus:
  repo: "olafkfreund/ravn-agents"
  repo_id: "PLACEHOLDER"
  category: "Announcements"
  category_id: "PLACEHOLDER"
