# MkDocs config for Backstage TechDocs.
#
# The published GitHub Pages site is a *Jekyll* site under docs/. TechDocs uses
# MkDocs, which can't parse Jekyll's Liquid (index.md / showcase.md), so the
# TechDocs source lives in its own docs_dir, `docs-techdocs/`, which holds an
# authored landing page plus symlinks to the MkDocs-safe canonical files
# (architecture, roadmap, contributing, security) and every design spec under
# plans/. scripts/techdocs-sync.sh (re)creates those symlinks, and the TechDocs
# CI workflow runs it before each build — so a new doc flows into Backstage
# automatically.
#
# There is deliberately NO `nav:` — MkDocs auto-builds the navigation from the
# file tree, so newly added docs appear without editing this file.
site_name: Ravn
site_description: >-
  Self-hosted self-healing for Linux fleets — deterministic detection, signed
  and auditable remediation, and AI that explains but never decides. Runs on
  hosts, Kubernetes, and air-gapped networks.
docs_dir: docs-techdocs
repo_url: https://github.com/olafkfreund/ravn-agents
edit_uri: edit/main/docs-techdocs/

plugins:
  - techdocs-core

markdown_extensions:
  - admonition
  - toc:
      permalink: true
