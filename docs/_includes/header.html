<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">🐦‍⬛</span>
      <span class="brand__name">{{ site.title | escape }}</span>
    </a>

    <nav class="nav" aria-label="Primary">
      {%- for path in site.header_pages -%}
        {%- assign p = site.pages | where: "path", path | first -%}
        {%- if p -%}
          <a class="nav__link{% if page.url == p.url %} is-active{% endif %}"
             href="{{ p.url | relative_url }}">{{ p.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
      <a class="nav__link nav__link--ext"
         href="https://github.com/{{ site.repository }}">GitHub</a>

      <button id="theme-toggle" class="theme-toggle" type="button"
              aria-label="Toggle dark and light theme" aria-pressed="false" title="Toggle theme">
        <span class="theme-toggle__icon" aria-hidden="true"></span>
        <span class="theme-toggle__label">Theme</span>
      </button>
    </nav>
  </div>
</header>
