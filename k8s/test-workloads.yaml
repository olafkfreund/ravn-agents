# Two small test workloads in the `ravn-test` namespace (#53).
#
#  - healthy: a tiny pod that just sleeps (stays Running) — the baseline.
#  - crasher: a pod that exits non-zero on a loop → CrashLoopBackOff, producing
#    the KubeWorkload signals (BackOff / CrashLoopBackOff) the controller (#55)
#    will detect and the schema (#54) models.
#
# Apply with `k3d-up` (which also creates the cluster), or:
#   kubectl apply -f k8s/test-workloads.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: ravn-test
  labels:
    app.kubernetes.io/part-of: ravn-test
---
apiVersion: v1
kind: Pod
metadata:
  name: healthy
  namespace: ravn-test
  labels:
    app: ravn-healthy
spec:
  containers:
    - name: sleeper
      image: busybox:1.36
      command: ["sh", "-c", "echo healthy; sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: crasher
  namespace: ravn-test
  labels:
    app: ravn-crasher
spec:
  restartPolicy: Always
  containers:
    - name: boom
      image: busybox:1.36
      command: ["sh", "-c", "echo starting; sleep 2; echo crashing; exit 1"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: ravn-test
  labels:
    app: ravn-db
spec:
  containers:
    - name: server
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo -e 'HTTP/1.1 200 OK\\r\\nContent-Length: 3\\r\\n\\r\\nOK' | nc -l -p 8080; done"]
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: ravn-test
spec:
  selector:
    app: ravn-db
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: ravn-test
  labels:
    app: ravn-frontend
spec:
  restartPolicy: Always
  containers:
    - name: web
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -qO- http://db:8080 || (echo 'Database unreachable!'; exit 1); sleep 2; done"]
      livenessProbe:
        exec:
          command: ["sh", "-c", "wget -qO- http://db:8080"]
        initialDelaySeconds: 5
        periodSeconds: 5
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi

