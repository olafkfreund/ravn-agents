[workspace]
resolver = "2"
members = [
  "crates/ravn-core",
  "crates/ravn-crypto",
  "crates/ravn-agent",
  "crates/ravn-server",
  "crates/ravn-actuator",
  "crates/ravn-eval",
  "crates/ravn-k8s",
  "crates/ravn-mcp",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/olafkfreund/ravn-agents"

[workspace.dependencies]
ravn-core = { path = "crates/ravn-core" }
ravn-crypto = { path = "crates/ravn-crypto" }
ravn-agent = { path = "crates/ravn-agent" }

# Shared across crates — pinned once here to avoid version drift.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Names the virtual workspace for crane (avoids a placeholder-name warning).
[workspace.metadata.crane]
name = "ravn"
