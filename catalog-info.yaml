# Backstage Software Catalog descriptor for Ravn.
#
# A System (`ravn`) groups the Components (one per crate/binary + the portal),
# the control-plane API (from portal/openapi.json), and the backing Resources
# (Postgres, NATS). TechDocs is attached to the System and built from the
# `mkdocs.yml` at the repo root (see docs-techdocs/ + scripts/techdocs-sync.sh,
# kept in step by .github/workflows/techdocs.yml).
#
# Originally seeded by the olafkfreund/backstage catalog-onboard bot; expanded
# by hand into a full system model.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ravn
  description: >-
    Ravn — a fleet of small local-LLM agents that watch Linux/NixOS hosts and
    Kubernetes (logs, services, config drift, updates, access) and report in
    plain language, with a central control plane, a portal, and a supervised
    self-healing remediation loop. MIT-licensed, built in the open.
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://github.com/olafkfreund/ravn-agents/tree/main/
  tags:
    - rust
    - llm
    - observability
    - self-healing
    - nixos
    - kubernetes
    - monitoring
    - agents
  links:
    - url: https://olafkfreund.github.io/ravn-agents/
      title: Documentation site (GitHub Pages)
      icon: docs
    - url: https://github.com/olafkfreund/ravn-agents
      title: Repository
      icon: github
    - url: https://github.com/olafkfreund/ravn-agents/discussions
      title: Discussions
      icon: chat
    - url: https://olafkfreund.github.io/ravn-agents/architecture/
      title: Architecture
    - url: https://olafkfreund.github.io/ravn-agents/roadmap/
      title: Roadmap
spec:
  owner: olafkfreund
  domain: public
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ravn-control-plane-api
  description: >-
    REST + WebSocket API of the Ravn control plane: events, agent registry,
    categories, topology, agent enrollment, authenticated ingest, and the
    remediation command channel.
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
  tags:
    - rest
    - openapi
spec:
  type: openapi
  lifecycle: production
  owner: olafkfreund
  system: ravn
  definition:
    $text: ./portal/openapi.json
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ravn-server
  description: Control plane — ingests agent events over NATS, persists to Postgres, serves the portal API and live feed, signs remediation commands.
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
    backstage.io/source-location: url:https://github.com/olafkfreund/ravn-agents/tree/main/crates/ravn-server/
  tags:
    - rust
    - axum
    - control-plane
spec:
  type: service
  lifecycle: production
  owner: olafkfreund
  system: ravn
  providesApis:
    - ravn-control-plane-api
  dependsOn:
    - resource:ravn-postgres
    - resource:ravn-nats
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ravnd
  description: The Ravn edge agent — deterministic detection taps plus local small-LLM inference; pulls and relays signed remediation commands to the actuator.
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
    backstage.io/source-location: url:https://github.com/olafkfreund/ravn-agents/tree/main/crates/ravn-agent/
  tags:
    - rust
    - agent
    - edge
spec:
  type: service
  lifecycle: production
  owner: olafkfreund
  system: ravn
  consumesApis:
    - ravn-control-plane-api
  dependsOn:
    - component:ravn-actuator
    - resource:ravn-nats
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ravn-actuator
  description: The privileged remediation executor — runs only typed, whitelisted capabilities behind a peer-credential-checked local socket; the sole privileged component on a host.
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
    backstage.io/source-location: url:https://github.com/olafkfreund/ravn-agents/tree/main/crates/ravn-actuator/
  tags:
    - rust
    - security
    - remediation
spec:
  type: service
  lifecycle: experimental
  owner: olafkfreund
  system: ravn
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ravn-controller
  description: Kubernetes detection — watches the cluster API for workload and node signals and publishes them as Ravn events (deployed as a controller + node DaemonSet).
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
    backstage.io/source-location: url:https://github.com/olafkfreund/ravn-agents/tree/main/crates/ravn-k8s/
  tags:
    - rust
    - kubernetes
spec:
  type: service
  lifecycle: production
  owner: olafkfreund
  system: ravn
  consumesApis:
    - ravn-control-plane-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ravn-portal
  description: Web portal — fleet inventory, live message feed, agent detail, and the category-grouped topology view (React + TypeScript).
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
    backstage.io/source-location: url:https://github.com/olafkfreund/ravn-agents/tree/main/portal/
  tags:
    - typescript
    - react
    - frontend
spec:
  type: website
  lifecycle: production
  owner: olafkfreund
  system: ravn
  consumesApis:
    - ravn-control-plane-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ravn-core
  description: Shared types — the Event/Message schema and the remediation contract (templates, capabilities, signed command envelopes) used across agent and control plane.
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
    backstage.io/source-location: url:https://github.com/olafkfreund/ravn-agents/tree/main/crates/ravn-core/
  tags:
    - rust
    - library
spec:
  type: library
  lifecycle: production
  owner: olafkfreund
  system: ravn
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ravn-crypto
  description: Ed25519 signing and verification of remediation command envelopes — the single, auditable home for remediation crypto.
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
    backstage.io/source-location: url:https://github.com/olafkfreund/ravn-agents/tree/main/crates/ravn-crypto/
  tags:
    - rust
    - library
    - security
spec:
  type: library
  lifecycle: experimental
  owner: olafkfreund
  system: ravn
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ravn-postgres
  description: PostgreSQL store for events, the agent registry, categories, and the remediation audit trail.
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
  tags:
    - database
    - postgresql
spec:
  type: database
  owner: olafkfreund
  system: ravn
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ravn-nats
  description: NATS message broker — agents connect outbound-only and publish events; the control plane subscribes.
  annotations:
    github.com/project-slug: olafkfreund/ravn-agents
  tags:
    - message-broker
    - nats
spec:
  type: message-broker
  owner: olafkfreund
  system: ravn
