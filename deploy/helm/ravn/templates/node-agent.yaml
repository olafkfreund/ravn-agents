{{/*
ravn-node-agent — DaemonSet, one pod per node, watching node status conditions.

Detection-only via the Kubernetes API (no hostPath, no privileged access).
The optional container-stdout / node-OS journald taps described in the design
(#56) would add a tightly-scoped read-only hostPath here; they are intentionally
absent from the default manifests and left for a future values flag.
*/}}
{{- if .Values.nodeAgent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ravn-node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ravn.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      {{- include "ravn.componentSelectorLabels" (list . "node-agent") | nindent 6 }}
  # RollingUpdate with maxUnavailable=1 gives safe rolling restarts across the
  # fleet. Each pod is independent (watches only its own node), so a brief gap
  # in coverage per node is acceptable.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "ravn.labels" . | nindent 8 }}
        app.kubernetes.io/component: node-agent
      {{- with .Values.nodeAgent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: ravn-node-agent
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["ravn-node-agent"]
          env:
            # NODE_NAME scopes each DaemonSet pod's watch to its own node
            # (downward API) and is recorded as the event `host`.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- include "ravn.commonEnv" . | nindent 12 }}
            {{- with .Values.nodeAgent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.nodeAgent.resources | nindent 12 }}
          volumeMounts:
            {{- include "ravn.tokenVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "ravn.tokenVolume" . | nindent 8 }}
      {{- with .Values.nodeAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeAgent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
