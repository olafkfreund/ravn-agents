# P1 remediation template: restart a systemd unit that has entered the failed
# state. Safe tier — idempotent, no data loss. Authored in git and reviewed; the
# control plane loads it at startup and the actuator executes only its typed
# capabilities. See plans/2026-06-05-ravn-self-healing-remediation-design.md.
id = "failed-unit-restart"
version = 1
title = "Restart a failed systemd unit"
risk_tier = "safe"

[match]
source = "failed_unit"
conditions = { active_state = "failed" }

[parameters]
unit = { type = "string", from = "payload.unit" }

[[preconditions]]
equals = "failed"
check = { capability = "unit_state", unit = "{{unit}}" }

[[steps]]
capability = "reset_failed"
unit = "{{unit}}"

[[steps]]
capability = "restart_unit"
unit = "{{unit}}"

[verify]
equals = "active"
timeout_s = 30
check = { capability = "unit_state", unit = "{{unit}}" }

rollback = "none"
