# One-command Ravn demo: control plane + NATS + Postgres + a demo agent + portal.
#   docker compose up --build
# Then open the portal at http://localhost:8088
#
# Host ports are intentionally uncommon to avoid clashing with services you may
# already run. Internal services (Postgres, NATS) are not exposed to the host.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ravn
      POSTGRES_PASSWORD: ravn
      POSTGRES_DB: ravn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravn"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    command: ["--jetstream"]

  control-plane:
    build: .
    command: ["ravn-server"]
    environment:
      RAVN_BIND: 0.0.0.0:8080
      DATABASE_URL: postgres://ravn:ravn@postgres:5432/ravn
      NATS_URL: nats://nats:4222
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "18090:8080" # control-plane API (uncommon host port)

  agent:
    build: .
    command: ["ravnd"]
    environment:
      RAVN_SERVER_URL: nats://nats:4222
      RAVN_HOST: demo-agent
      # Host taps need a real systemd host; in the container we demo
      # config-drift on a mounted dir plus heartbeats.
      RAVN_JOURNALD: "0"
      RAVN_AUTH: "0"
      RAVN_FAILED_UNITS: "0"
      RAVN_UPDATES: "0"
      RAVN_CONFIG_DRIFT_PATHS: /watch
      RUST_LOG: info
    volumes:
      - ./docker/watch:/watch
    depends_on:
      - nats
      - control-plane

  portal:
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
    ports:
      - "8088:80" # portal UI
    depends_on:
      - control-plane

volumes:
  pgdata:
