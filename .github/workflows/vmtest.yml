name: VM e2e

# NixOS VM end-to-end tests.  Both tests boot a full stack under QEMU and are
# deliberately excluded from `nix flake check` (slow under emulation).
#
# Jobs:
#   remediation-e2e  — the standard self-healing loop (#121)
#   airgapped-e2e    — identical heal loop with outbound networking blocked (#153)

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - templates/**
      - nixos/**
      - flake.nix
      - flake.lock
      - .github/workflows/vmtest.yml
  pull_request:
    paths:
      - crates/**
      - templates/**
      - nixos/**
      - flake.nix
      - flake.lock
      - .github/workflows/vmtest.yml
  workflow_dispatch: {}

jobs:
  remediation-e2e:
    name: remediation e2e (NixOS VM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Magic Nix Cache removed (now needs FlakeHub auth + throttled GH cache).
      - name: Build + run the remediation VM test
        run: nix build .#remediation-e2e -L

  airgapped-e2e:
    name: air-gapped e2e (NixOS VM, no outbound network)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Magic Nix Cache removed (now needs FlakeHub auth + throttled GH cache).
      # The air-gapped VM test (#153):
      #   - removes the default gateway inside the VM before starting any service
      #   - sets RAVN_AIRGAPPED=1 on ravn-server
      #   - applies iptables OUTPUT DROP for non-loopback traffic
      #   - runs the full signed heal loop (fail unit → propose → approve → healed)
      #   - asserts zero established connections to non-loopback peers after the run
      #
      # Inference is DISABLED in this job (no model weights in CI).  A separate
      # manual job below covers the inference path when a model is available.
      - name: Build + run the air-gapped VM test
        run: nix build .#airgapped-e2e -L
