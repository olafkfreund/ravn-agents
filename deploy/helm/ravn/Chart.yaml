apiVersion: v2
name: ravn
description: >-
  Ravn in-cluster Kubernetes agents — a cluster-wide workload controller
  (Deployment) and a per-node agent (DaemonSet) that forward workload- and
  node-health events to the Ravn control plane. Detection-only, read-only RBAC.
  A gated slot for the executor component (#146) is included and disabled by
  default.
type: application

# Chart version — bump on every chart change (semver).
version: 0.2.0

# Version of the ravn-k8s binaries this chart ships by default.
# Override with --set image.tag=<sha> for a specific build.
appVersion: "0.2.0"

home: https://github.com/olafkfreund/ravn-agents
sources:
  - https://github.com/olafkfreund/ravn-agents

keywords:
  - observability
  - kubernetes
  - monitoring
  - self-healing
  - remediation

maintainers:
  - name: olafkfreund
    url: https://github.com/olafkfreund

# Require Kubernetes 1.21+ for projected ServiceAccount token API stability.
kubeVersion: ">=1.21.0-0"

annotations:
  # Marks this chart as compatible with the executor component from issue #146.
  # Set executor.enabled=true once #146 ships the ravn-executor binary.
  ravn.io/executor-gate: "#146"
