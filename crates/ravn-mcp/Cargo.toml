[package]
name = "ravn-mcp"
description = "The Ravn MCP server: a read-only-by-default Model Context Protocol bridge to the Ravn control plane (#156)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ravn-mcp"
path = "src/main.rs"

[dependencies]
# Reuse the shared Ravn types (RemediationRecord et al.) so the MCP surface
# never drifts from the control-plane contract.
ravn-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# HTTP client to the control plane. rustls so we don't pull OpenSSL for an
# external-facing binary that talks TLS to the API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
